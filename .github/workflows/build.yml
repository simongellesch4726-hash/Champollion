name: Build Champollion .deb for iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install boost cmake

    - name: Build fmt as static library
      run: |
        git clone https://github.com/fmtlib/fmt.git
        cd fmt
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_OSX_ARCHITECTURES=arm64 \
                 -DBUILD_SHARED_LIBS=OFF \
                 -DCMAKE_INSTALL_PREFIX=../install
        make -j$(sysctl -n hw.logicalcpu)
        make install

    - name: Build Champollion (statically linked)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_OSX_ARCHITECTURES=arm64 \
                 -DBUILD_SHARED_LIBS=OFF \
                 -DBoost_USE_STATIC_LIBS=ON \
                 -Dfmt_DIR=$PWD/../fmt/install/lib/cmake/fmt
        make -j$(sysctl -n hw.logicalcpu)

    - name: Create .deb package structure
      run: |
        mkdir -p deb/usr/local/bin
        # Find binary
        if [ -f build/Champollion ]; then
          cp build/Champollion deb/usr/local/bin/
        elif [ -f build/bin/Champollion ]; then
          cp build/bin/Champollion deb/usr/local/bin/
        else
          echo "Error: Champollion binary not found!"
          ls -la build/
          exit 1
        fi
        mkdir -p deb/DEBIAN
        cat > deb/DEBIAN/control << EOF
        Package: champollion
        Version: 1.3.2-1
        Section: utils
        Priority: optional
        Architecture: iphoneos-arm
        Maintainer: Your Name <you@example.com>
        Description: Papyrus decompiler for Skyrim SE
         Champollion decompiles .pex files to readable .psc source.
        EOF
        cat > deb/DEBIAN/postinst << 'EOF'
        #!/bin/sh
        chmod 755 /usr/local/bin/Champollion
        exit 0
        EOF
        chmod 755 deb/DEBIAN/postinst

    - name: Build .deb
      run: |
        dpkg-deb --build deb champollion.deb

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: champollion.deb
        path: champollion.deb
