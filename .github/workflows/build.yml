name: Build Champollion for iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install boost cmake fmt

    - name: Build for ARM64
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        make -j$(sysctl -n hw.logicalcpu)

    - name: Copy fmt library
      run: |
        mkdir -p libs
        cp /opt/homebrew/opt/fmt/lib/libfmt.12.dylib libs/

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: Champollion-iOS
        path: build/Champollion

    - name: Upload fmt library
      uses: actions/upload-artifact@v4
      with:
        name: libfmt
        path: libs/libfmt.12.dylib
