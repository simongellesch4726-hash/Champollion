name: Build Champollion for iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install boost cmake fmt

    - name: Build for ARM64 (Static)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_OSX_ARCHITECTURES=arm64 \
                 -DBUILD_SHARED_LIBS=OFF \
                 -DBoost_USE_STATIC_LIBS=ON \
                 -DFMT_HEADER_ONLY=ON
        make -j$(sysctl -n hw.logicalcpu)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: Champollion-iOS
        path: build/Champollion
